<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>דף הבית — DogCare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background-color: #f4f6f4;
      min-height: 100vh;
    }

    /* ===== NAVBAR ===== */
      nav {
  background: #ffffff;
  border-bottom: 1px solid #dde5dd;
  padding: 0.75rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  font-size: 16px;
  font-weight: 600;
  color: #4a7c59;
  text-decoration: none;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  list-style: none;
}

.nav-links a {
  font-weight: 500;
  font-size: 15px;
  color: #5a6e5a;
  text-decoration: none;
  transition: color 0.15s;
}

.nav-links a:hover,
.nav-links a.active {
  color: #4a7c59;
  font-weight: 600;
}

.nav-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #c8d5c8;
  cursor: pointer;
}

    /* ===== HERO ===== */
    .welcome-section {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }

    .welcome-section h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1e2d1e;
      margin-bottom: 0.5rem;
    }

    .welcome-section h1 span {
      color: #4a7c59;
    }

    .welcome-section .subtitle {
      font-size: 15px;
      color: #6b7c6b;
      margin-bottom: 0.25rem;
    }

    .welcome-section .dog-name {
      font-size: 18px;
      font-weight: 600;
      color: #3d6b4a;
      margin-bottom: 2rem;
    }

    /* ===== HERO IMAGE ===== */
    .dog-banner {
      display: flex;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .dog-banner img {
      width: 100%;
      max-width: 700px;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(74,124,89,0.12);
    }

    /* ===== QUICK ACCESS CARDS ===== */
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #1e2d1e;
      margin-bottom: 1rem;
      text-align: center;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    .quick-card {
      background: #ffffff;
      border: 1px solid #dde5dd;
      border-radius: 12px;
      padding: 1.25rem 1rem;
      text-align: center;
      text-decoration: none;
      transition: box-shadow 0.15s, border-color 0.15s;
      cursor: pointer;
    }

    .quick-card:hover {
      border-color: #4a7c59;
      box-shadow: 0 2px 12px rgba(74,124,89,0.1);
    }

    .quick-card .card-icon {
      font-size: 28px;
      display: block;
      margin-bottom: 0.5rem;
    }

    .quick-card .card-label {
      font-size: 13px;
      font-weight: 500;
      color: #1e2d1e;
    }

    .quick-card .card-sub {
      font-size: 11px;
      color: #9aaa9a;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html" class="nav-logo">🐾 DogCare</a>
    <ul class="nav-links">
      <li><a href="foods-allowed.html">מאכלים מותרים</a></li>
      <li><a href="foods-forbidden.html">מאכלים אסורים</a></li>
      <li><a href="supplements.html">המלצות</a></li>
      <li><a href="vets.html">וטרינרים</a></li>
      <li><a href="emergency.html">חירום</a></li>
    </ul>
    <img
      class="nav-avatar"
      src="https://i.pravatar.cc/100"
      alt="תמונת פרופיל"
    />
  </nav>

  <!-- HERO -->
  <section class="welcome-section">
    <h1>ברוכים הבאים ל<span>DogCare</span> 🐶</h1>
    <p class="subtitle">שלום, ישראל!</p>
    <p class="dog-name">🐾 רקסי שמח שאתה כאן</p>

    <div class="dog-banner">
      <img
        src="https://images.unsplash.com/photo-1444212477490-ca407925329e?w=900&q=80"
        alt="כלבים מאושרים"
      />
    </div>
  </section>



</body>
</html>
