<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>עריכת פרופיל — DogCare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background-color: #f4f6f4;
      min-height: 100vh;
    }

    /* ===== NAVBAR ===== */
    nav {
  background: #ffffff;
  border-bottom: 1px solid #dde5dd;
  padding: 0.75rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  font-size: 16px;
  font-weight: 600;
  color: #4a7c59;
  text-decoration: none;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  list-style: none;
}

.nav-links a {
  font-weight: 500;
  font-size: 15px;
  color: #5a6e5a;
  text-decoration: none;
  transition: color 0.15s;
}

.nav-links a:hover,
.nav-links a.active {
  color: #4a7c59;
  font-weight: 600;
}

.nav-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #c8d5c8;
  cursor: pointer;
}

    /* ===== PAGE HEADER ===== */
    .page-header {
      text-align: center;
      padding: 2rem 1rem 1.5rem;
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1e2d1e;
      margin-bottom: 0.35rem;
    }

    .page-header p {
      font-size: 13px;
      color: #6b7c6b;
    }

    /* ===== CARD ===== */
    .card {
      background: #ffffff;
      border: 1px solid #dde5dd;
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ===== AVATAR SECTION ===== */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.75rem;
    }

    .avatar-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #c8d5c8;
    }

    .change-avatar-btn {
      font-size: 12px;
      color: #4a7c59;
      background: none;
      border: 1px solid #c8d5c8;
      border-radius: 8px;
      padding: 5px 14px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .change-avatar-btn:hover {
      border-color: #4a7c59;
    }

    input[type="file"] {
      display: none;
    }

    /* ===== FORM ===== */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 13px;
      color: #5a6e5a;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #c8d5c8;
      border-radius: 8px;
      background: #ffffff;
      color: #1e2d1e;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #4a7c59;
    }

    .divider {
      border: none;
      border-top: 1px solid #dde5dd;
      margin: 0.5rem 0;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: #9aaa9a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ===== BUTTONS ===== */
    .btn-save {
      width: 100%;
      padding: 11px;
      background: #4a7c59;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
      margin-top: 4px;
    }

    .btn-save:hover {
      background: #3d6b4a;
    }

    .btn-cancel {
      width: 100%;
      padding: 10px;
      background: none;
      color: #6b7c6b;
      border: 1px solid #c8d5c8;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .btn-cancel:hover {
      border-color: #4a7c59;
      color: #4a7c59;
    }

    .wrapper {
      padding: 0 1.5rem 3rem;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html" class="nav-logo">🐾 DogCare</a>
    <ul class="nav-links">
      <li><a href="foods-allowed.html">מאכלים מותרים</a></li>
      <li><a href="foods-forbidden.html">מאכלים אסורים</a></li>
      <li><a href="supplements.html">חטיפים ותוספים</a></li>
      <li><a href="vets.html">וטרינרים</a></li>
      <li><a href="emergency.html">חירום</a></li>
    </ul>
    <img class="nav-avatar" src="https://i.pravatar.cc/100" alt="תמונת פרופיל" />
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>👤 עריכת פרופיל</h1>
    <p>עדכן את פרטי החשבון שלך</p>
  </div>

  <!-- FORM CARD -->
  <div class="wrapper">
    <div class="card">

      <!-- AVATAR -->
      <div class="avatar-section">
        <img
          class="avatar-img"
          src="https://i.pravatar.cc/200"
          alt="תמונת פרופיל"
        />
        <label for="avatar-upload" class="change-avatar-btn">🖼 החלף תמונה</label>
        <input type="file" id="avatar-upload" name="avatar" accept="image/*" />
      </div>

      <div class="form-group">

        <!-- PERSONAL INFO -->
        <p class="section-label">פרטים אישיים</p>

        <div class="field">
          <label for="full-name">שם מלא</label>
          <input type="text" id="full-name" name="fullName" value="ישראל ישראלי" />
        </div>

        <div class="field">
          <label for="email">אימייל</label>
          <input type="email" id="email" name="email" value="israel@example.com" />
        </div>

        <div class="field">
          <label for="dog-name">שם הכלב</label>
          <input type="text" id="dog-name" name="dogName" value="רקסי" />
        </div>

        <hr class="divider" />

        <!-- PASSWORD -->
        <p class="section-label">שינוי סיסמה</p>

        <div class="field">
          <label for="current-password">סיסמה נוכחית</label>
          <input type="password" id="current-password" name="currentPassword" placeholder="הזן סיסמה נוכחית" />
        </div>

        <div class="field">
          <label for="new-password">סיסמה חדשה</label>
          <input type="password" id="new-password" name="newPassword" placeholder="לפחות 6 תווים" />
        </div>

        <div class="field">
          <label for="confirm-password">אימות סיסמה חדשה</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="הזן שוב את הסיסמה החדשה" />
        </div>

        <hr class="divider" />

        <!-- ACTIONS -->
        <button class="btn-save">שמור שינויים</button>
        <a href="index.html" class="btn-cancel">ביטול</a>

      </div>
    </div>
  </div>

</body>
</html>
